data class PlayerState(
    val id: String,
    var name: String,
    var characterType: CharacterType,
    var x: Float,
    var y: Float,
    var angle: Float = 0f,
    var hp: Int = 100,
    var maxHp: Int = 100,
    var score: Int = 0,
    var kills: Int = 0,
    var deaths: Int = 0,
    var isDashing: Boolean = false,
    var isShielded: Boolean = false,
    var currentWeapon: WeaponType = WeaponType.FIST,
    var isDead: Boolean = false,
    var respawnTimerSec: Int = 0
) : Serializable

data class Projectile(
    val id: Long,
    val ownerId: String,
    val weaponType: WeaponType,
    var x: Float,
    var y: Float,
    val vx: Float,
    val vy: Float,
    var distanceRemaining: Float,
    val damage: Int
) : Serializable

data class ItemPickup(
    val id: Long,
    val weaponType: WeaponType?,
    val isHealthPack: Boolean,
    val x: Float,
    val y: Float,
    var isActive: Boolean = true
) : Serializable

data class Obstacle(
    val x: Float,
    val y: Float,
    val width: Float,
    val height: Float,
    val type: ObstacleType,
    val label: String = ""
) : Serializable {
    fun contains(px: Float, py: Float, radius: Float = 0f): Boolean {
        return px + radius >= x && px - radius <= x + width &&
               py + radius >= y && py - radius <= y + height
    }
}

enum class ObstacleType {
    BUILDING, WALL, CAR, TRASH_BIN, SHOP, ALLEY_BARRIER
}
