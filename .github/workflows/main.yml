name: Build Zangaoui Mini Militia Engine

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Generate Clean Project Structure
        run: |
          mkdir -p app/src/main/java/com/zangaoui/game
          mkdir -p app/src/main/res/values

      - name: Setup Gradle Files
        run: |
          cat << 'EOF' > settings.gradle
          rootProject.name = "Zangaoui"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'
          apply plugin: 'kotlin-android'

          android {
              namespace 'com.zangaoui.game'
              compileSdk 34

              defaultConfig {
                  applicationId "com.zangaoui.game"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

      - name: Setup Manifest and Resources
        run: |
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">زنقاوي - Zangaoui</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="landscape">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Write Full Mini Militia Game Engine in Kotlin
        run: |
          cat << 'EOF' > app/src/main/java/com/zangaoui/game/MainActivity.kt
          package com.zangaoui.game

          import android.app.Activity
          import android.content.Context
          import android.graphics.*
          import android.os.Bundle
          import android.view.MotionEvent
          import android.view.SurfaceHolder
          import android.view.SurfaceView
          import java.net.DatagramPacket
          import java.net.DatagramSocket
          import java.net.InetAddress
          import kotlin.math.*

          enum class Weapon(val label: String, val speed: Float, val damage: Int, val cooldown: Long) {
              STONE("حجر", 36f, 25, 250L),
              BRICK("آجور", 22f, 55, 600L),
              PAN("مقلاة", 0f, 60, 400L),
              POT("قدر", 26f, 40, 500L)
          }

          data class Particle(var x: Float, var y: Float, var vx: Float, var vy: Float, var color: Int, var life: Float, val maxLife: Float, val radius: Float)

          data class Projectile(
              var x: Float, var y: Float, var vx: Float, var vy: Float,
              val weapon: Weapon, val shooterId: Int, var bounces: Int = 2
          )

          data class Player(
              var id: Int, var name: String, var x: Float, var y: Float,
              var vx: Float, var vy: Float, var angle: Float,
              var health: Int, var kills: Int, var deaths: Int,
              var isThrusting: Boolean = false, var shieldTime: Long = 0L
          )

          class MainActivity : Activity() {
              private lateinit var gameView: GameView
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  gameView = GameView(this)
                  setContentView(gameView)
              }
              override fun onResume() { super.onResume(); gameView.start() }
              override fun onPause() { super.onPause(); gameView.stop() }
          }

          class GameView(context: Context) : SurfaceView(context), SurfaceHolder.Callback, Runnable {
              private var thread: Thread? = null
              @Volatile private var running = false
              private val paint = Paint(Paint.ANTI_ALIAS_FLAG)

              private val WORLD_W = 3800f
              private val WORLD_H = 2200f

              private val myId = (1000..9999).random()
              private var myName = "زنقاوي"
              private var me = Player(myId, myName, 800f, 1500f, 0f, 0f, 0f, 100, 0, 0)
              private var nitro = 100f
              private var onGround = false
              private var activeWeapon = Weapon.STONE
              private var lastFireTime = 0L

              private var camX = 0f
              private var camY = 0f

              private val platforms = ArrayList<RectF>()
              private val particles = ArrayList<Particle>()
              private val projectiles = ArrayList<Projectile>()
              private val otherPlayers = HashMap<Int, Player>()

              private val killFeed = ArrayList<String>()
              private var killFeedTimer = 0L

              private val leftCenter = PointF(260f, 820f)
              private val rightCenter = PointF(1850f, 820f)
              private var leftKnob = PointF(260f, 820f)
              private var rightKnob = PointF(1850f, 820f)
              private var leftActive = false
              private var rightActive = false

              private var currentMap = 0
              private val mapNames = arrayOf("العمارات 105 مسكن", "ZH قرية قديمة", "غابة المقام")

              private var socket: DatagramSocket? = null
              private val PORT = 9050

              init {
                  holder.addCallback(this)
                  buildMapPlatforms()
                  initNetwork()
              }

              private fun buildMapPlatforms() {
                  platforms.clear()
                  platforms.add(RectF(0f, WORLD_H - 120f, WORLD_W, WORLD_H))
                  platforms.add(RectF(0f, 0f, 80f, WORLD_H))
                  platforms.add(RectF(WORLD_W - 80f, 0f, WORLD_W, WORLD_H))

                  when (currentMap) {
                      0 -> {
                          platforms.add(RectF(400f, 1700f, 1200f, 1740f))
                          platforms.add(RectF(400f, 1300f, 1200f, 1340f))
                          platforms.add(RectF(300f, 900f, 1300f, 950f))
                          platforms.add(RectF(1800f, 1500f, 2600f, 1540f))
                          platforms.add(RectF(2000f, 1100f, 2800f, 1150f))
                          platforms.add(RectF(1900f, 750f, 2900f, 800f))
                          platforms.add(RectF(1350f, 1850f, 1750f, 1900f))
                      }
                      1 -> {
                          platforms.add(RectF(500f, 1600f, 1400f, 1660f))
                          platforms.add(RectF(800f, 1250f, 1500f, 1310f))
                          platforms.add(RectF(1700f, 1650f, 2500f, 1710f))
                          platforms.add(RectF(2100f, 1300f, 3100f, 1360f))
                          platforms.add(RectF(2700f, 900f, 3500f, 960f))
                      }
                      2 -> {
                          platforms.add(RectF(300f, 1650f, 900f, 1700f))
                          platforms.add(RectF(1200f, 1450f, 1900f, 1500f))
                          platforms.add(RectF(600f, 1150f, 1500f, 1200f))
                          platforms.add(RectF(2100f, 1250f, 2900f, 1300f))
                          platforms.add(RectF(1500f, 800f, 2300f, 850f))
                      }
                  }
              }

              private fun initNetwork() {
                  Thread {
                      try {
                          socket = DatagramSocket(PORT)
                          val buf = ByteArray(512)
                          while (true) {
                              val p = DatagramPacket(buf, buf.size)
                              socket?.receive(p)
                              handleIncomingPacket(String(p.data, 0, p.length))
                          }
                      } catch (e: Exception) {}
                  }.start()
              }

              private fun broadcast(msg: String) {
                  Thread {
                      try {
                          val ds = DatagramSocket()
                          ds.broadcast = true
                          val bytes = msg.toByteArray()
                          val p = DatagramPacket(bytes, bytes.size, InetAddress.getByName("255.255.255.255"), PORT)
                          ds.send(p)
                          ds.close()
                      } catch (e: Exception) {}
                  }.start()
              }

              private fun handleIncomingPacket(msg: String) {
                  val s = msg.split(";")
                  when (s[0]) {
                      "POS" -> {
                          val id = s[1].toInt()
                          if (id != myId) {
                              val pl = otherPlayers[id] ?: Player(id, s[2], s[3].toFloat(), s[4].toFloat(), 0f, 0f, 0f, 100, 0, 0)
                              pl.name = s[2]; pl.x = s[3].toFloat(); pl.y = s[4].toFloat(); pl.angle = s[5].toFloat()
                              pl.isThrusting = s[6].toBoolean(); pl.health = s[7].toInt(); pl.kills = s[8].toInt()
                              otherPlayers[id] = pl
                          }
                      }
                      "FIRE" -> {
                          if (s[1].toInt() != myId) {
                              val w = Weapon.valueOf(s[2])
                              projectiles.add(Projectile(s[3].toFloat(), s[4].toFloat(), s[5].toFloat(), s[6].toFloat(), w, s[1].toInt()))
                          }
                      }
                      "KILL" -> {
                          killFeed.add("${s[1]} قضى على ${s[2]} بواسطة ${s[3]}")
                          killFeedTimer = System.currentTimeMillis()
                      }
                  }
              }

              override fun run() {
                  var lastTime = System.currentTimeMillis()
                  while (running) {
                      val now = System.currentTimeMillis()
                      val dt = (now - lastTime) / 1000f
                      lastTime = now

                      updateGame(dt)
                      renderFrame()

                      try { Thread.sleep(15) } catch (e: Exception) {}
                  }
              }

              private fun updateGame(dt: Float) {
                  me.isThrusting = false
                  if (leftActive) {
                      val dx = leftKnob.x - leftCenter.x
                      val dy = leftKnob.y - leftCenter.y
                      val len = hypot(dx, dy)
                      if (len > 30f) {
                          val nx = dx / len
                          val ny = dy / len
                          if (nitro > 0f) {
                              me.vx += nx * 45f
                              me.vy += ny * 45f
                              nitro -= 15f * dt
                              me.isThrusting = true
                              particles.add(Particle(me.x - nx * 20f, me.y + 35f, -nx * 100f + ((-20..20).random()), -ny * 100f, Color.LTGRAY, 0.4f, 0.4f, 12f))
                          }
                      }
                  }

                  me.vy += 850f * dt
                  me.vx *= 0.94f
                  me.vy *= 0.96f
                  me.vx = me.vx.coerceIn(-550f, 550f)
                  me.vy = me.vy.coerceIn(-750f, 750f)

                  me.x += me.vx * dt
                  me.y += me.vy * dt

                  onGround = false
                  val pBox = RectF(me.x - 24f, me.y - 45f, me.x + 24f, me.y + 45f)
                  for (plat in platforms) {
                      if (RectF.intersects(plat, pBox)) {
                          if (me.vy > 0 && me.y < plat.top + 25f) {
                              me.y = plat.top - 45f
                              me.vy = 0f
                              onGround = true
                          } else if (me.vy < 0 && me.y > plat.bottom - 25f) {
                              me.y = plat.bottom + 45f
                              me.vy = 0f
                          } else if (me.vx > 0) {
                              me.x = plat.left - 25f
                              me.vx = 0f
                          } else if (me.vx < 0) {
                              me.x = plat.right + 25f
                              me.vx = 0f
                          }
                      }
                  }

                  if (onGround && nitro < 100f) nitro = (nitro + 60f * dt).coerceAtMost(100f)

                  if (rightActive) {
                      val rdx = rightKnob.x - rightCenter.x
                      val rdy = rightKnob.y - rightCenter.y
                      if (hypot(rdx, rdy) > 25f) {
                          me.angle = atan2(rdy, rdx)
                          val now = System.currentTimeMillis()
                          if (now - lastFireTime > activeWeapon.cooldown) {
                              fireWeapon()
                              lastFireTime = now
                          }
                      }
                  }

                  val pIter = projectiles.iterator()
                  while (pIter.hasNext()) {
                      val pr = pIter.next()
                      pr.x += pr.vx * 30f * dt
                      pr.y += pr.vy * 30f * dt
                      pr.vy += 450f * dt

                      for (plat in platforms) {
                          if (plat.contains(pr.x, pr.y)) {
                              if (pr.weapon == Weapon.BRICK) {
                                  repeat(6) {
                                      particles.add(Particle(pr.x, pr.y, (-120..120).random().toFloat(), (-150..50).random().toFloat(), Color.rgb(180, 50, 30), 0.5f, 0.5f, 8f))
                                  }
                                  pIter.remove()
                                  break
                              } else {
                                  pr.vy = -pr.vy * 0.6f
                                  pr.bounces--
                                  if (pr.bounces <= 0) { pIter.remove(); break }
                              }
                          }
                      }

                      if (pr.shooterId != myId && hypot(pr.x - me.x, pr.y - me.y) < 40f) {
                          if (System.currentTimeMillis() > me.shieldTime) {
                              me.health -= pr.weapon.damage
                              repeat(5) {
                                  particles.add(Particle(me.x, me.y, (-80..80).random().toFloat(), (-80..80).random().toFloat(), Color.RED, 0.4f, 0.4f, 6f))
                              }
                              if (me.health <= 0) {
                                  me.deaths++
                                  broadcast("KILL;خصم;$myName;${pr.weapon.label}")
                                  respawnPlayer()
                              }
                          }
                          pIter.remove()
                      }
                  }

                  val itPart = particles.iterator()
                  while (itPart.hasNext()) {
                      val pt = itPart.next()
                      pt.x += pt.vx * dt
                      pt.y += pt.vy * dt
                      pt.life -= dt
                      if (pt.life <= 0f) itPart.remove()
                  }

                  val targetCamX = me.x - width / 2f
                  val targetCamY = me.y - height / 2f
                  camX += (targetCamX - camX) * 0.1f
                  camY += (targetCamY - camY) * 0.1f

                  broadcast("POS;$myId;$myName;${me.x};${me.y};${me.angle};${me.isThrusting};${me.health};${me.kills}")
              }

              private fun fireWeapon() {
                  if (activeWeapon == Weapon.PAN) {
                      for (other in otherPlayers.values) {
                          if (hypot(other.x - me.x, other.y - me.y) < 95f) {
                              broadcast("KILL;$myName;${other.name};المقلاة")
                              me.kills++
                          }
                      }
                  } else {
                      val vx = cos(me.angle) * activeWeapon.speed
                      val vy = sin(me.angle) * activeWeapon.speed
                      projectiles.add(Projectile(me.x, me.y - 10f, vx, vy, activeWeapon, myId))
                      broadcast("FIRE;$myId;${activeWeapon.name};${me.x};${me.y - 10f};$vx;$vy")
                  }
              }

              private fun respawnPlayer() {
                  me.health = 100
                  me.x = (500..3000).random().toFloat()
                  me.y = 800f
                  me.vx = 0f
                  me.vy = 0f
                  me.shieldTime = System.currentTimeMillis() + 3000L
              }

              private fun renderFrame() {
                  if (!holder.surface.isValid) return
                  val canvas = holder.lockCanvas() ?: return

                  canvas.drawColor(if (currentMap == 2) Color.rgb(20, 30, 45) else Color.rgb(150, 190, 225))

                  canvas.save()
                  canvas.translate(-camX, -camY)

                  paint.style = Paint.Style.FILL
                  for (plat in platforms) {
                      when (currentMap) {
                          0 -> {
                              paint.color = Color.rgb(105, 105, 110)
                              canvas.drawRect(plat, paint)
                              paint.color = Color.rgb(200, 70, 50)
                              canvas.drawRect(plat.left, plat.top, plat.right, plat.top + 8f, paint)
                          }
                          1 -> {
                              paint.color = Color.rgb(165, 95, 60)
                              canvas.drawRect(plat, paint)
                          }
                          2 -> {
                              paint.color = Color.rgb(35, 110, 50)
                              canvas.drawRect(plat, paint)
                          }
                      }
                  }

                  for (pt in particles) {
                      paint.color = pt.color
                      paint.alpha = (pt.life / pt.maxLife * 255).toInt()
                      canvas.drawCircle(pt.x, pt.y, pt.radius, paint)
                  }
                  paint.alpha = 255

                  for (pr in projectiles) {
                      when (pr.weapon) {
                          Weapon.STONE -> { paint.color = Color.GRAY; canvas.drawCircle(pr.x, pr.y, 9f, paint) }
                          Weapon.BRICK -> { paint.color = Color.rgb(180, 40, 20); canvas.drawRect(pr.x - 12f, pr.y - 7f, pr.x + 12f, pr.y + 7f, paint) }
                          Weapon.POT -> { paint.color = Color.DKGRAY; canvas.drawCircle(pr.x, pr.y, 14f, paint) }
                          else -> {}
                      }
                  }

                  if (rightActive && activeWeapon != Weapon.PAN) {
                      paint.color = Color.argb(180, 255, 40, 40)
                      paint.strokeWidth = 3f
                      for (i in 1..14) {
                          val lx = me.x + cos(me.angle) * (i * 45f)
                          val ly = me.y - 10f + sin(me.angle) * (i * 45f) + (i * i * 3f)
                          canvas.drawCircle(lx, ly, 4f, paint)
                      }
                  }

                  for (op in otherPlayers.values) {
                      drawDoodlePlayer(canvas, op, false)
                  }
                  drawDoodlePlayer(canvas, me, true)

                  canvas.restore()

                  renderHUD(canvas)

                  holder.unlockCanvasAndPost(canvas)
              }

              private fun drawDoodlePlayer(c: Canvas, p: Player, isMe: Boolean) {
                  c.save()
                  c.translate(p.x, p.y)

                  if (System.currentTimeMillis() < p.shieldTime) {
                      paint.color = Color.argb(110, 0, 230, 255)
                      c.drawCircle(0f, 0f, 55f, paint)
                  }

                  if (p.isThrusting) {
                      paint.color = Color.rgb(255, 140, 0)
                      c.drawCircle(-10f, 48f, 10f, paint)
                      c.drawCircle(10f, 48f, 10f, paint)
                  }

                  paint.color = Color.rgb(40, 50, 70)
                  paint.strokeWidth = 9f
                  c.drawLine(-12f, 20f, -12f, 45f, paint)
                  c.drawLine(12f, 20f, 12f, 45f, paint)

                  paint.color = if (isMe) Color.rgb(210, 45, 45) else Color.rgb(45, 110, 210)
                  c.drawRoundRect(RectF(-22f, -25f, 22f, 25f), 10f, 10f, paint)

                  paint.color = Color.rgb(255, 220, 190)
                  c.drawCircle(0f, -48f, 20f, paint)
                  paint.color = Color.BLACK
                  c.drawRect(-10f, -42f, 10f, -36f, paint)

                  paint.color = Color.WHITE
                  c.drawCircle(-7f, -52f, 5f, paint)
                  c.drawCircle(7f, -52f, 5f, paint)
                  paint.color = Color.BLACK
                  c.drawCircle(-7f + cos(p.angle) * 2f, -52f + sin(p.angle) * 2f, 2.5f, paint)
                  c.drawCircle(7f + cos(p.angle) * 2f, -52f + sin(p.angle) * 2f, 2.5f, paint)

                  c.save()
                  c.translate(0f, -8f)
                  c.rotate(Math.toDegrees(p.angle.toDouble()).toFloat())
                  paint.color = Color.rgb(255, 220, 190)
                  c.drawRoundRect(RectF(0f, -5f, 32f, 5f), 4f, 4f, paint)
                  paint.color = Color.DKGRAY
                  c.drawCircle(36f, 0f, 9f, paint)
                  c.restore()

                  paint.textSize = 20f
                  paint.color = Color.YELLOW
                  paint.textAlign = Paint.Align.CENTER
                  c.drawText(p.name, 0f, -80f, paint)

                  paint.color = Color.RED
                  c.drawRect(-25f, -74f, 25f, -68f, paint)
                  paint.color = Color.GREEN
                  c.drawRect(-25f, -74f, -25f + (p.health / 100f * 50f), -68f, paint)

                  c.restore()
              }

              private fun renderHUD(canvas: Canvas) {
                  paint.color = Color.argb(60, 255, 255, 255)
                  canvas.drawCircle(leftCenter.x, leftCenter.y, 130f, paint)
                  paint.color = Color.argb(160, 255, 200, 0)
                  canvas.drawCircle(leftKnob.x, leftKnob.y, 45f, paint)

                  paint.color = Color.argb(60, 255, 255, 255)
                  canvas.drawCircle(rightCenter.x, rightCenter.y, 130f, paint)
                  paint.color = Color.argb(160, 255, 50, 50)
                  canvas.drawCircle(rightKnob.x, rightKnob.y, 45f, paint)

                  paint.color = Color.DKGRAY
                  canvas.drawRoundRect(RectF(50f, 40f, 370f, 75f), 8f, 8f, paint)
                  paint.color = Color.RED
                  canvas.drawRoundRect(RectF(55f, 45f, 55f + (me.health / 100f * 310f), 70f), 6f, 6f, paint)

                  paint.color = Color.DKGRAY
                  canvas.drawRoundRect(RectF(50f, 85f, 370f, 115f), 8f, 8f, paint)
                  paint.color = Color.rgb(255, 180, 0)
                  canvas.drawRoundRect(RectF(55f, 90f, 55f + (nitro / 100f * 310f), 110f), 6f, 6f, paint)

                  var wx = 420f
                  for (w in Weapon.values()) {
                      paint.color = if (w == activeWeapon) Color.rgb(255, 200, 0) else Color.argb(150, 60, 60, 60)
                      canvas.drawRoundRect(RectF(wx, 40f, wx + 110f, 95f), 10f, 10f, paint)
                      paint.color = Color.WHITE
                      paint.textSize = 24f
                      paint.textAlign = Paint.Align.CENTER
                      canvas.drawText(w.label, wx + 55f, 75f, paint)
                      wx += 125f
                  }

                  paint.color = Color.argb(180, 20, 100, 160)
                  canvas.drawRoundRect(RectF(wx + 20f, 40f, wx + 320f, 95f), 10f, 10f, paint)
                  paint.color = Color.WHITE
                  paint.textSize = 22f
                  canvas.drawText(mapNames[currentMap], wx + 170f, 75f, paint)

                  if (System.currentTimeMillis() - killFeedTimer < 4000L && killFeed.isNotEmpty()) {
                      paint.color = Color.argb(180, 0, 0, 0)
                      canvas.drawRoundRect(RectF(50f, 130f, 550f, 180f), 8f, 8f, paint)
                      paint.color = Color.WHITE
                      paint.textSize = 22f
                      paint.textAlign = Paint.Align.LEFT
                      canvas.drawText(killFeed.last(), 65f, 162f, paint)
                  }

                  paint.color = Color.argb(180, 0, 0, 0)
                  canvas.drawRoundRect(RectF(1450f, 30f, 1880f, 240f), 12f, 12f, paint)
                  paint.color = Color.YELLOW
                  paint.textSize = 26f
                  paint.textAlign = Paint.Align.LEFT
                  canvas.drawText("🏆 الترتيب (Classement)", 1470f, 65f, paint)

                  val ranking = ArrayList<Player>()
                  ranking.add(me)
                  ranking.addAll(otherPlayers.values)
                  ranking.sortByDescending { it.kills }

                  var ry = 105f
                  for ((idx, p) in ranking.take(4).withIndex()) {
                      paint.color = if (p.id == myId) Color.GREEN else Color.WHITE
                      paint.textSize = 22f
                      canvas.drawText("#${idx + 1} ${p.name} - ${p.kills} قتلى", 1470f, ry, paint)
                      ry += 32f
                  }
              }

              override fun onTouchEvent(event: MotionEvent): Boolean {
                  for (i in 0 until event.pointerCount) {
                      val x = event.getX(i)
                      val y = event.getY(i)
                      val action = event.actionMasked

                      if (action == MotionEvent.ACTION_DOWN) {
                          var wx = 420f
                          for (w in Weapon.values()) {
                              if (x in wx..(wx + 110f) && y in 40f..95f) {
                                  activeWeapon = w
                                  return true
                              }
                              wx += 125f
                          }
                          if (x in (wx + 20f)..(wx + 320f) && y in 40f..95f) {
                              currentMap = (currentMap + 1) % 3
                              buildMapPlatforms()
                              return true
                          }
                      }

                      if (x < width / 2f) {
                          if (action == MotionEvent.ACTION_UP || action == MotionEvent.ACTION_POINTER_UP) {
                              leftKnob.set(leftCenter.x, leftCenter.y)
                              leftActive = false
                          } else {
                              leftActive = true
                              val dx = x - leftCenter.x
                              val dy = y - leftCenter.y
                              val dist = hypot(dx, dy)
                              if (dist < 130f) {
                                  leftKnob.set(x, y)
                              } else {
                                  leftKnob.set(leftCenter.x + (dx / dist) * 130f, leftCenter.y + (dy / dist) * 130f)
                              }
                          }
                      } else {
                          if (action == MotionEvent.ACTION_UP || action == MotionEvent.ACTION_POINTER_UP) {
                              rightKnob.set(rightCenter.x, rightCenter.y)
                              rightActive = false
                          } else {
                              rightActive = true
                              rightKnob.set(x, y)
                          }
                      }
                  }
                  return true
              }

              fun start() { running = true; thread = Thread(this); thread?.start() }
              fun stop() { running = false; thread?.join() }
              override fun surfaceCreated(h: SurfaceHolder) { start() }
              override fun surfaceChanged(h: SurfaceHolder, f: Int, w: Int, ht: Int) {}
              override fun surfaceDestroyed(h: SurfaceHolder) { stop() }
          }
          EOF

      - name: Build APK Direct
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zangaoui-Game-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
